[project]
name = "ai-agents-capstone"
version = "0.1.0"
description = "EduPathway AI — Adaptive Learning & IEP Assistant (5-Day AI Agents Capstone)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.5.0,<3.0.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.10.0",
    "rich>=13.9.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "google-cloud-dlp>=3.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.uv]
index-url = "https://pypi.org/simple"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "app"]
